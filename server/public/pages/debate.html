<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Court: The Ultimate Legal Debate</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons (Switched to jsDelivr to avoid Tracking Prevention blocks) -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        /* Custom scrollbar to match the dark theme */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020617; } /* slate-950 */
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; } /* slate-800 */
        ::-webkit-scrollbar-thumb:hover { background: #334155; } /* slate-700 */
    </style>
</head>
<body class="bg-slate-950 text-slate-200 overflow-hidden">
    <div id="app" class="h-screen w-full"></div>

    <script>
        // --- API Configuration ---
        // PASTE YOUR NEW API KEY INSIDE THESE QUOTES:
        const apiKey = "AIzaSyBuL9g6DI8PBxbziwMhN2S_kp0eCs_Mqng"; 

        // --- Exponential Backoff Fetch ---
        const fetchWithBackoff = async (url, options, retries = 5) => {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        const errMsg = errData?.error?.message || `HTTP error! status: ${response.status}`;
                        
                        throw new Error(errMsg);
                    }
                    return await response.json();
                } catch (error) {
                    if (i === retries - 1) throw error;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        };

        // --- Gemini API Call Wrapper ---
        const callGemini = async (prompt, systemInstruction, schema) => {
            // Changed back to the standard public gemini-1.5-flash model for local use
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
            
            // Appending system instruction to prompt for maximum API compatibility
            const combinedPrompt = `${systemInstruction}\n\nUser Request: ${prompt}`;

            const payload = {
                contents: [{ parts: [{ text: combinedPrompt }] }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: schema
                }
            };

            const result = await fetchWithBackoff(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            let text = result.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!text) throw new Error("No response from AI. Your prompt might have been blocked by safety filters.");
            
            // Clean up Markdown backticks if the model ignores the JSON mimeType directive
            text = text.replace(/^```json\s*/i, '').replace(/\s*```$/i, '').trim();
            
            return JSON.parse(text);
        };

        // --- JSON Schemas ---
        const caseSchema = {
            type: "OBJECT",
            properties: {
                caseName: { type: "STRING", description: "Name of the court case (e.g., Smith v. State)" },
                facts: { type: "STRING", description: "The factual background of the case" },
                constitutionalConflict: { type: "STRING", description: "The core constitutional issue at stake" }
            },
            required: ["caseName", "facts", "constitutionalConflict"]
        };

        const evaluationSchema = {
            type: "OBJECT",
            properties: {
                judgeEvaluation: {
                    type: "OBJECT",
                    properties: {
                        logicScore: { type: "INTEGER", description: "Score out of 10 for logic" },
                        clarityScore: { type: "INTEGER", description: "Score out of 10 for clarity" },
                        constitutionScore: { type: "INTEGER", description: "Score out of 10 for constitutional knowledge" },
                        feedback: { type: "STRING", description: "Constructive feedback from the judge" },
                        judgeStatement: { type: "STRING", description: "What the judge says aloud in the courtroom" }
                    },
                    required: ["logicScore", "clarityScore", "constitutionScore", "feedback", "judgeStatement"]
                },
                opposingCounselArgument: { type: "STRING", description: "The counter-argument from the AI opposing counsel" }
            },
            required: ["judgeEvaluation", "opposingCounselArgument"]
        };

        const TOPIC_LEVELS = [
            {
                level: "Beginner",
                desc: "Clear-cut issues involving fundamental rights. Great for familiarizing with the debate format.",
                topics: ["Student Free Speech in Schools", "Mandatory Uniform Laws", "Curfew Ordinances for Minors"]
            },
            {
                level: "Intermediate",
                desc: "Complex scenarios balancing safety vs. privacy or state vs. individual rights.",
                topics: ["Compulsory Vaccine Passports", "Digital Privacy vs. National Security", "Eminent Domain for Private Development"]
            },
            {
                level: "Expert",
                desc: "Deep legal theory involving nuanced precedents and ambiguous amendments.",
                topics: ["AI Authorship & Copyright Rights", "The Non-Delegation Doctrine & Climate Regulation", "State Sovereignty vs. Global Digital Accords"]
            }
        ];

        // --- Application State ---
        let gameState = 'idle'; // idle, choosing_topic, loading_case, debating, loading_eval
        let selectedLevel = null;
        let legalCase = null;
        let userRole = null; 
        let chatHistory = [];
        let error = '';
        let cumulativeScores = { logic: 0, clarity: 0, constitution: 0, rounds: 0 };
        let tempInput = ''; // To preserve input during re-renders or errors

        // --- Core Logic & Event Handlers ---
        window.handleStartClick = () => {
            gameState = 'choosing_topic';
            error = ''; // Clear errors on fresh start
            render();
        };

        window.handleBackClick = () => {
            gameState = 'idle';
            render();
        };

        window.handleExitDebate = () => {
            gameState = 'choosing_topic';
            render();
        };

        window.handleTopicClick = (btn) => {
            const topic = btn.getAttribute('data-topic');
            const level = btn.getAttribute('data-level');
            generateCase(topic, level);
        };

        window.handleKeyDown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitArgument();
            }
        };

        window.handleSubmit = () => {
            submitArgument();
        };

        async function generateCase(topicSuggestion, level) {
            gameState = 'loading_case';
            error = '';
            render();

            try {
                const prompt = `Generate a fictional legal case for a high-stakes debate based on the theme: "${topicSuggestion}". 
                Difficulty Level: ${level}. 
                Ensure the case name is unique and the facts provide deep legal tension for both sides. Return ONLY valid JSON.`;
                
                const sysInstruct = "You are a legal debate generator for a prestigious law school.";
                
                const caseData = await callGemini(prompt, sysInstruct, caseSchema);
                
                const role = Math.random() > 0.5 ? 'Plaintiff' : 'Defense';
                legalCase = caseData;
                userRole = role;
                chatHistory = [{
                    sender: 'judge',
                    text: `The session of the AI Legal Debate is now open. I am the Presiding AI Moderator. Today's case is ${caseData.caseName}. Counselor, as lead for the ${role}, please open the floor with your primary argument.`,
                    scores: null
                }];
                gameState = 'debating';
                cumulativeScores = { logic: 0, clarity: 0, constitution: 0, rounds: 0 };
                render();
            } catch (err) {
                console.error("Case Generation Error:", err);
                error = `Failed to generate case: ${err.message}`;
                gameState = 'choosing_topic';
                render();
            }
        }

        async function submitArgument() {
            const inputEl = document.getElementById('arg-input');
            const userInput = inputEl ? inputEl.value : '';
            
            if (!userInput.trim()) return;

            chatHistory.push({ sender: 'user', text: userInput, role: userRole });
            gameState = 'loading_eval';
            error = '';
            tempInput = ''; // clear input after successful capture
            render();

            try {
                const prompt = `
                Case: ${legalCase.caseName}
                Facts: ${legalCase.facts}
                Conflict: ${legalCase.constitutionalConflict}
                User Role: ${userRole}
                User Input: "${userInput}"
                `;

                const sysInstruct = "You are an AI Legal Moderator. Act as Judge (scoring 1-10 on logic, clarity, constitution) and Opposing Counsel in a formal debate. Return valid JSON.";

                const evaluation = await callGemini(prompt, sysInstruct, evaluationSchema);

                const { logicScore, clarityScore, constitutionScore } = evaluation.judgeEvaluation;
                cumulativeScores.logic += logicScore;
                cumulativeScores.clarity += clarityScore;
                cumulativeScores.constitution += constitutionScore;
                cumulativeScores.rounds += 1;

                chatHistory.push({
                    sender: 'judge',
                    text: evaluation.judgeEvaluation.judgeStatement,
                    feedback: evaluation.judgeEvaluation.feedback,
                    scores: { logic: logicScore, clarity: clarityScore, constitution: constitutionScore }
                });

                chatHistory.push({
                    sender: 'opposing',
                    text: evaluation.opposingCounselArgument,
                    role: userRole === 'Plaintiff' ? 'Defense' : 'Plaintiff'
                });

                gameState = 'debating';
                render();

            } catch (err) {
                console.error("Debate Evaluation Error:", err);
                error = `Network drop or API error: ${err.message}`;
                gameState = 'debating';
                tempInput = userInput; // restore so they don't lose their text
                render();
            }
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-scroll-container');
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
        }

        // --- UI Rendering Functions ---

        function getScoreBarHTML(label, score, colorClass) {
            return `
                <div>
                    <div class="flex justify-between text-xs font-bold text-slate-400 mb-1 font-sans">
                        <span>${label}</span>
                        <span>${score}/10</span>
                    </div>
                    <div class="h-1.5 bg-slate-800 rounded-full overflow-hidden">
                        <div class="h-full ${colorClass} transition-all duration-1000 ease-out" style="width: ${(score / 10) * 100}%"></div>
                    </div>
                </div>
            `;
        }

        function getMiniScoreHTML(label, score) {
            let color = "text-green-400";
            if (score < 6) color = "text-red-400";
            else if (score < 8) color = "text-yellow-400";

            return `
                <div class="bg-slate-950/60 p-2 rounded border border-slate-800/50 text-center">
                    <div class="text-[10px] text-slate-500 uppercase font-bold tracking-tight mb-1">${label}</div>
                    <div class="text-lg font-bold ${color}">${score}<span class="text-[10px] text-slate-600 ml-0.5">/10</span></div>
                </div>
            `;
        }

        function renderIdle() {
            return `
                <div class="min-h-screen flex items-center justify-center p-4 font-serif">
                    <div class="max-w-2xl text-center space-y-8 p-10 bg-slate-900 rounded-2xl border border-slate-700 shadow-2xl relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-600 via-purple-400 to-blue-600"></div>
                        <i data-lucide="message-square-quote" class="w-20 h-20 mx-auto text-blue-500 mb-4"></i>
                        <h1 class="text-5xl font-bold text-slate-100 tracking-tight">AI Legal Debate</h1>
                        <p class="text-xl text-slate-400 leading-relaxed font-sans">
                            Master the art of legal rhetoric. Choose your case, defend your position, and see if your logic survives the scrutiny of our AI Bench.
                        </p>
                        <button onclick="handleStartClick()" class="group inline-flex items-center gap-3 px-10 py-5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition-all text-xl shadow-lg hover:scale-105">
                            <i data-lucide="gavel" class="w-6 h-6 group-hover:rotate-12 transition-transform"></i>
                            Start New Debate
                        </button>
                    </div>
                </div>
            `;
        }

        function renderChoosingTopic() {
            let errorHTML = '';
            if (error) {
                errorHTML = `
                    <div class="mb-8 max-w-5xl w-full mx-auto p-4 bg-red-900/30 border border-red-800 rounded-xl text-red-400 text-sm flex items-center gap-3 font-sans shadow-lg">
                        <i data-lucide="alert-triangle" class="w-6 h-6 shrink-0"></i>
                        <span class="font-medium">${error}</span>
                    </div>
                `;
            }

            const cardsHTML = TOPIC_LEVELS.map(level => {
                const colorClass = level.level === 'Beginner' ? 'text-green-400' : 
                                   level.level === 'Intermediate' ? 'text-blue-400' : 'text-purple-400';
                
                const buttonsHTML = level.topics.map(topic => `
                    <button data-topic="${topic}" data-level="${level.level}" onclick="handleTopicClick(this)" class="w-full text-left p-3 rounded-lg bg-slate-800 hover:bg-blue-600 hover:text-white transition-all group flex items-center justify-between text-sm font-sans font-medium">
                        ${topic}
                        <i data-lucide="chevron-right" class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-opacity"></i>
                    </button>
                `).join('');

                return `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col hover:border-blue-500/50 transition-colors shadow-xl">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-xl font-bold ${colorClass}">${level.level}</h3>
                            <i data-lucide="brain-circuit" class="w-5 h-5 opacity-40"></i>
                        </div>
                        <p class="text-sm text-slate-400 font-sans mb-6 h-12">${level.desc}</p>
                        <div class="space-y-3 mt-auto">
                            ${buttonsHTML}
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="min-h-screen flex flex-col items-center justify-center p-6 font-serif">
                    <div class="max-w-5xl w-full">
                        <div class="text-center mb-12">
                            <h2 class="text-4xl font-bold text-white mb-2 tracking-tight">Select Debate Complexity</h2>
                            <p class="text-slate-400 font-sans">Choose the legal depth for today's confrontation.</p>
                        </div>
                        
                        ${errorHTML}

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            ${cardsHTML}
                        </div>

                        <button onclick="handleBackClick()" class="mt-12 text-slate-500 hover:text-white transition-colors flex items-center gap-2 mx-auto font-sans">
                            Back to Lobby
                        </button>
                    </div>
                </div>
            `;
        }

        function renderLoadingCase() {
            return `
                <div class="min-h-screen flex flex-col items-center justify-center p-4 text-blue-500 font-serif gap-4">
                    <i data-lucide="loader-2" class="w-16 h-16 animate-spin"></i>
                    <h2 class="text-2xl animate-pulse">Initializing legal parameters...</h2>
                </div>
            `;
        }

        function renderDebating() {
            const aiRole = userRole === 'Plaintiff' ? 'Defense' : 'Plaintiff';
            const userRoleClass = userRole === 'Plaintiff' ? 'bg-blue-900/30 text-blue-300 border-blue-800' : 'bg-red-900/30 text-red-300 border-red-800';
            
            let scoresHTML = '';
            if (cumulativeScores.rounds > 0) {
                scoresHTML = `
                    <div class="pt-6 border-t border-slate-700">
                         <h3 class="text-sm font-bold text-blue-500 uppercase tracking-wider mb-4 flex items-center gap-2 font-sans">
                            <i data-lucide="award" class="w-4 h-4"></i> Debate Performance
                        </h3>
                        <div class="space-y-3">
                            ${getScoreBarHTML('Logic', Math.round(cumulativeScores.logic / cumulativeScores.rounds), 'bg-blue-500')}
                            ${getScoreBarHTML('Clarity', Math.round(cumulativeScores.clarity / cumulativeScores.rounds), 'bg-purple-500')}
                            ${getScoreBarHTML('Legality', Math.round(cumulativeScores.constitution / cumulativeScores.rounds), 'bg-indigo-500')}
                        </div>
                    </div>
                `;
            }

            const chatMessagesHTML = chatHistory.map((msg, idx) => {
                const alignClass = msg.sender === 'user' ? 'items-end' : 'items-start';
                
                let headerHTML = '';
                let bubbleClass = '';
                
                if (msg.sender === 'judge') {
                    headerHTML = `<i data-lucide="gavel" class="w-4 h-4 text-blue-500"></i> AI Moderator`;
                    bubbleClass = 'bg-slate-900 border-slate-800 w-full text-left';
                } else if (msg.sender === 'opposing') {
                    headerHTML = `<i data-lucide="bot" class="w-4 h-4 text-slate-300"></i> AI Counter-Counsel (${aiRole})`;
                    bubbleClass = 'bg-slate-800 border-slate-700 w-11/12 md:w-3/4 rounded-tl-sm text-left';
                } else {
                    headerHTML = `<i data-lucide="user" class="w-4 h-4 text-purple-400"></i> You (${userRole})`;
                    bubbleClass = 'bg-blue-900/20 border-blue-800/50 w-11/12 md:w-3/4 rounded-tr-sm text-right';
                }

                let evaluationHTML = '';
                if (msg.scores) {
                    evaluationHTML = `
                        <div class="mt-4 pt-4 border-t border-slate-800 bg-slate-950/40 p-4 rounded-xl text-left font-sans">
                            <h4 class="text-blue-500 font-bold text-xs mb-3 flex items-center gap-2 uppercase tracking-widest">
                                <i data-lucide="file-text" class="w-4 h-4"></i> Moderator's Evaluation
                            </h4>
                            <div class="grid grid-cols-3 gap-3 mb-4">
                                ${getMiniScoreHTML('Logic', msg.scores.logic)}
                                ${getMiniScoreHTML('Clarity', msg.scores.clarity)}
                                ${getMiniScoreHTML('Legal', msg.scores.constitution)}
                            </div>
                            <p class="text-sm text-slate-400 italic">" ${msg.feedback} "</p>
                        </div>
                    `;
                }

                return `
                    <div class="flex flex-col max-w-4xl mx-auto w-full ${alignClass}">
                        <div class="flex items-center gap-2 mb-2 text-sm font-bold text-slate-400 font-sans">
                            ${headerHTML}
                        </div>
                        <div class="p-5 rounded-2xl shadow-md border leading-relaxed text-slate-200 ${bubbleClass}">
                            <p class="whitespace-pre-wrap">${msg.text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</p>
                            ${evaluationHTML}
                        </div>
                    </div>
                `;
            }).join('');

            let loadingEvalHTML = '';
            if (gameState === 'loading_eval') {
                loadingEvalHTML = `
                    <div class="flex flex-col items-start max-w-4xl mx-auto w-full">
                        <div class="flex items-center gap-2 text-blue-500 text-sm font-bold animate-pulse font-sans">
                            <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> AI is formulating a response...
                        </div>
                    </div>
                `;
            }

            let errorHTML = '';
            if (error) {
                errorHTML = `
                    <div class="mb-2 text-red-400 text-sm flex items-center gap-2 font-sans">
                        <i data-lucide="alert-circle" class="w-4 h-4"></i> ${error}
                    </div>
                `;
            }

            const inputDisabled = gameState !== 'debating' ? 'disabled' : '';
            const btnDisabled = gameState !== 'debating' ? 'disabled' : '';
            const inputValue = gameState === 'debating' && tempInput ? tempInput : '';

            return `
                <div class="h-screen flex flex-col md:flex-row font-serif w-full">
                    <!-- Sidebar / Case Details -->
                    <div class="w-full md:w-1/3 lg:w-1/4 bg-slate-900 border-b md:border-b-0 md:border-r border-slate-800 flex flex-col max-h-screen overflow-y-auto">
                        <div class="p-6 space-y-6">
                            <div class="text-center pb-6 border-b border-slate-700">
                                <i data-lucide="scale" class="w-12 h-12 mx-auto text-blue-500 mb-3"></i>
                                <h2 class="text-xl font-bold text-white mb-1">DEBATE DOCKET</h2>
                                <p class="text-blue-500 font-bold text-lg">${legalCase?.caseName}</p>
                            </div>
                            
                            <div>
                                <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2 font-sans">
                                    <i data-lucide="user" class="w-4 h-4"></i> Your Assigned Side
                                </h3>
                                <div class="px-4 py-2 rounded font-bold text-center border ${userRoleClass}">
                                    ${userRole} Counselor
                                </div>
                            </div>

                            <div>
                                <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2 font-sans">
                                    <i data-lucide="book-open" class="w-4 h-4"></i> Case Background
                                </h3>
                                <p class="text-sm text-slate-300 font-sans leading-relaxed bg-slate-800/50 p-4 rounded border border-slate-700">
                                    ${legalCase?.facts}
                                </p>
                            </div>

                            <div>
                                <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2 font-sans">
                                    <i data-lucide="alert-circle" class="w-4 h-4"></i> Core Dispute
                                </h3>
                                <p class="text-sm text-slate-300 font-sans leading-relaxed bg-slate-800/50 p-4 rounded border border-slate-700">
                                    ${legalCase?.constitutionalConflict}
                                </p>
                            </div>

                            ${scoresHTML}
                        </div>
                    </div>

                    <!-- Main Debate Area -->
                    <div class="flex-1 flex flex-col max-h-screen bg-slate-950 w-full overflow-hidden">
                        <header class="bg-slate-900 border-b border-slate-800 p-4 flex items-center justify-between shadow-sm shrink-0">
                            <h1 class="font-bold text-slate-100 flex items-center gap-2 font-sans">
                                <i data-lucide="message-square-quote" class="w-5 h-5 text-blue-500"></i> Debate Transcript
                            </h1>
                            <button onclick="handleExitDebate()" class="text-xs text-slate-500 hover:text-blue-500 transition-colors uppercase tracking-widest font-sans font-bold">
                                Exit Debate
                            </button>
                        </header>

                        <div id="chat-scroll-container" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-8 scroll-smooth h-full">
                            ${chatMessagesHTML}
                            ${loadingEvalHTML}
                        </div>

                        <div class="p-4 bg-slate-900 border-t border-slate-800 shadow-xl shrink-0 w-full">
                            <div class="max-w-4xl mx-auto">
                                ${errorHTML}
                                <div class="relative">
                                    <textarea
                                        id="arg-input"
                                        onkeydown="handleKeyDown(event)"
                                        ${inputDisabled}
                                        placeholder="Submit your legal argument... (Enter to send)"
                                        class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 pr-14 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 resize-none font-sans"
                                        rows="3"
                                    >${inputValue}</textarea>
                                    <button
                                        onclick="handleSubmit()"
                                        ${btnDisabled}
                                        class="absolute bottom-4 right-4 p-2 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 disabled:text-slate-500 text-white rounded-lg transition-colors flex items-center justify-center shadow-lg cursor-pointer disabled:cursor-not-allowed"
                                    >
                                        <i data-lucide="send" class="w-5 h-5"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- Main Render Function ---
        function render() {
            const app = document.getElementById('app');
            
            if (gameState === 'idle') {
                app.innerHTML = renderIdle();
            } else if (gameState === 'choosing_topic') {
                app.innerHTML = renderChoosingTopic();
            } else if (gameState === 'loading_case') {
                app.innerHTML = renderLoadingCase();
            } else {
                app.innerHTML = renderDebating();
            }

            // Initialize Lucide icons on newly injected HTML
            lucide.createIcons();

            // Post-render side-effects
            if (gameState === 'debating' || gameState === 'loading_eval') {
                scrollToBottom();
                if (gameState === 'debating') {
                    const inputEl = document.getElementById('arg-input');
                    if (inputEl) inputEl.focus();
                }
            }
        }

        // Initial render
        render();
    </script>
</body>
</html>
