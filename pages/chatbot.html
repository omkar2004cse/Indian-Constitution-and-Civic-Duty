<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Constitution Tutor Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    /* Basic styles – adjust to match your app theme */
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    #constitution-chatbot {
      max-width: 420px;
      height: 550px;
      background: #ffffff;
      margin: 20px auto;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chatbot-header {
      padding: 12px 16px;
      background: #1e3a8a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chatbot-header-left {
      flex: 1;
    }

    .chatbot-header h2 {
      font-size: 16px;
      margin: 0;
    }

    .chatbot-header span {
      font-size: 11px;
      opacity: 0.85;
    }

    .ai-status {
      font-size: 10px;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 8px;
      border-radius: 12px;
      margin-top: 4px;
      display: inline-block;
    }

    .ai-status.active {
      background: #10b981;
    }

    .chatbot-messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      background: #eef2ff;
    }

    .message {
      margin-bottom: 10px;
      max-width: 90%;
      padding: 8px 10px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .message.user {
      background: #d1fae5;
      align-self: flex-end;
      margin-left: auto;
      border-bottom-right-radius: 2px;
    }

    .message.bot {
      background: #ffffff;
      align-self: flex-start;
      margin-right: auto;
      border-bottom-left-radius: 2px;
    }

    .chatbot-input-area {
      padding: 8px;
      border-top: 1px solid #e5e7eb;
      background: #f9fafb;
      display: flex;
      gap: 6px;
    }

    .chatbot-input-area textarea {
      flex: 1;
      resize: none;
      min-height: 40px;
      max-height: 80px;
      padding: 6px 8px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 14px;
      outline: none;
    }

    .chatbot-input-area button {
      padding: 0 14px;
      border-radius: 10px;
      border: none;
      background: #1d4ed8;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chatbot-input-area button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .typing-indicator {
      font-size: 12px;
      color: #6b7280;
      padding: 4px 8px;
    }
    .quick-actions {
      padding: 8px;
      background: #f9fafb;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .quick-btn {
      padding: 4px 8px;
      background: #dbeafe;
      color: #1e40af;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-btn:hover {
      background: #3b82f6;
      color: white;
    }
  </style>
</head>
<body>

<div id="constitution-chatbot">
  <div class="chatbot-header">
    <div class="chatbot-header-left">
      <h2>Constitution Tutor</h2>
      <span>Ask about Indian Constitution & civic duties</span>
      <div class="ai-status" id="aiStatus">🤖 Basic Mode</div>
    </div>
    <button id="backBtn" style="background:none;border:none;color:white;cursor:pointer;padding:8px;font-size:20px;" title="Back to Dashboard">←</button>
  </div>

  <div id="messages" class="chatbot-messages"></div>

  <div class="quick-actions">
    <button class="quick-btn" onclick="askQuickQuestion('Tell me about Article 21')">Article 21</button>
    <button class="quick-btn" onclick="askQuickQuestion('What are Fundamental Rights?')">Fundamental Rights</button>
  </div>

  <div class="chatbot-input-area">
    <textarea id="userInput" placeholder="Ask: What are Fundamental Rights?"></textarea>
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
  // ===== Configuration =====
  const CHAT_API_URL = "http://localhost:3000/api/chat";

  const messagesContainer = document.getElementById("messages");
  const userInput = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");
  const backBtn = document.getElementById("backBtn");
  const aiStatus = document.getElementById("aiStatus");

  // Back button functionality
  backBtn.addEventListener("click", () => {
    window.location.href = "dashboard.html";
  });
  
  // Store full conversation to send to backend
  const conversation = [];

  // Quick question handler
  function askQuickQuestion(question) {
    userInput.value = question;
    sendMessage();
  }

  // Add message to UI with markdown-like formatting support
  function addMessageToUI(text, sender = "bot") {
    const msgDiv = document.createElement("div");
    msgDiv.classList.add("message", sender);
    
    // Convert markdown-style formatting to HTML
    let formattedText = text
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>') // Bold
      .replace(/\n/g, '<br>'); // Line breaks
    
    msgDiv.innerHTML = formattedText;
    messagesContainer.appendChild(msgDiv);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  function setTypingIndicator(show) {
    let typing = document.getElementById("typingIndicator");
    if (show) {
      if (!typing) {
        typing = document.createElement("div");
        typing.id = "typingIndicator";
        typing.className = "typing-indicator";
        typing.textContent = "Tutor is typing...";
        messagesContainer.appendChild(typing);
      }
    } else {
      if (typing) typing.remove();
    }
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  // Check n8n status
  function checkAIStatus() {
    aiStatus.textContent = '🤖 n8n Webhook Active';
    aiStatus.classList.add('active');
  }

  // Main send message function
  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    // Add user message to UI and conversation
    addMessageToUI(text, "user");
    conversation.push({ role: "user", content: text });

    userInput.value = "";
    sendBtn.disabled = true;
    setTypingIndicator(true);

    try {
      // Priority: Use n8n webhook for real-time AI responses
      const response = await fetch(CHAT_API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: conversation }),
      });

      if (response.ok) {
        const data = await response.json();
        if (data.reply && data.reply.content) {
          const aiResponse = data.reply.content;
          addMessageToUI(aiResponse, "bot");
          conversation.push({ role: "assistant", content: aiResponse });
        } else {
          throw new Error("Invalid response format");
        }
      } else {
        throw new Error(`Server error: ${response.status}`);
      }
    } catch (err) {
      console.error("Error with n8n webhook:", err);
      addMessageToUI(
        "⚠️ Unable to connect to the chatbot service.\n\n" +
        "💡 Please ensure:\n• Server is running on http://localhost:3000\n• n8n webhook is properly configured\n\n" +
        "Error: " + err.message,
        "bot"
      );
    } finally {
      sendBtn.disabled = false;
      setTypingIndicator(false);
    }
  }

  // Event listeners
  sendBtn.addEventListener("click", sendMessage);

  userInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Initial welcome message
  window.addEventListener("load", () => {
    checkAIStatus();
    
    addMessageToUI(
      "Namaste! 👋 I am your Indian Constitution tutor powered by AI. \n\n" +
      "• Ask me anything about the Indian Constitution\n" +
      "• Fundamental Rights, Duties, and Principles\n" +
      "• Parliament, President, Supreme Court\n" +
      "• Constitutional articles, amendments, and more\n\n" +
      "How can I help you today?",
      "bot"
    );
  });
</script>

</body>
</html>
